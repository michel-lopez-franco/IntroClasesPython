# Proyecto independiente para las presentaciones (Reveal.js).
# El libro (../_quarto.yml) lo renderiza en su pre-render y copia slides/_site/ a _book/slides/_site/.
# Es tipo "website" para que todas las presentaciones compartan las bibliotecas (site_libs/).
project:
  type: website
  output-dir: _site

lang: es

format:
  revealjs:
    theme: simple
    slide-number: true
    code-line-numbers: false
    highlight-style: github
    width: 1280
    height: 720
    footer: "POO en Python · Propedéutico CUCEI"
    preview-links: false

execute:
  echo: true
